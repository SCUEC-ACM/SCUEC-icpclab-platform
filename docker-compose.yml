version: '3.8'

services:
  # 前端服务 (Vue 3)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: SCUEC-lab-platform-frontend
    restart: always
    ports:
      - '8888:80'
    depends_on:
      - backend

  # 后端服务 (Go)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: SCUEC-lab-platform-backend
    restart: always
    ports:
      - '3000:3000'
    environment:
      - DB_HOST=database
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    depends_on:
      database:
        condition: service_healthy # 等待数据库健康检查通过

  # 数据库服务 (PostgreSQL)
  database:
    image: postgres:16-alpine
    container_name: SCUEC-lab-platform-database
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck: # 健康检查：确保数据库真的准备好了
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
